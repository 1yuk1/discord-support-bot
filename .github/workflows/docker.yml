name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        # Тяжёлые пакеты (torch, chromadb) не нужны: тесты покрывают чистую
        # логику, а импорты этих модулей подменяются заглушками.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "discord.py>=2.3,<3" "aiohttp>=3.9" "httpx>=0.25"

      - name: Check bash syntax
        run: |
          bash -n entrypoint.sh
          bash -n scripts/start.sh

      - name: Validate egg.json
        run: python -c "import json; json.load(open('egg.json', encoding='utf-8'))"

      - name: Run tests
        run: python -m pytest -v

  build-and-push:
    name: Build and push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,compression=zstd,compression-level=3
          provenance: false
